title = "lattix-xfrontier gitleaks config"

[extend]
useDefault = true

[[allowlists]]
# Allow redaction placeholders (e.g. "[REDACTED]", "[REDACTED_TOKEN]") without excluding whole source files.
description = "Redaction placeholders, local env files, and the generated frontend node catalog"
regexes = [
  "\\[REDACTED[^\\]]*\\]"
]
paths = [
  "(?i)\\..*\\.env",
  "apps/frontend/src/lib/frontier-node-catalog.ts"
]

[[allowlists]]
description = "Ignore generated local installer state, build artifacts, and internal worktree copies"
paths = [
  '''^\.artifacts/''',
  '''^\.installer/''',
  '''^\.claude/worktrees/''',
  '''^apps/frontend/\.next/''',
]
