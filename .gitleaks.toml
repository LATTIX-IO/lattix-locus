title = "lattix-locus gitleaks config"

[extend]
useDefault = true

[[allowlists]]
# Allow redaction placeholders (e.g. "[REDACTED]", "[REDACTED_TOKEN]") without excluding whole source files.
description = "Redaction placeholders, local env files, and the generated frontend node catalog"
regexes = [
  "\\[REDACTED[^\\]]*\\]"
]
paths = [
  "(?i)\\..*\\.env",
  "apps/frontend/src/lib/locus-node-catalog.ts"
]

[[allowlists]]
description = "Ignore generated local installer state, build artifacts, and internal worktree copies"
paths = [
  '''^\.artifacts/''',
  '''^\.installer/''',
  '''^\.claude/worktrees/''',
  '''^apps/frontend/\.next/''',
]

[[allowlists]]
# The Locus browser extension's manifest "key" is a PUBLIC key (SubjectPublicKeyInfo,
# base64) that pins the Chromium extension ID (LOCUS-350). No private key exists in the repo.
description = "Public key pinning the Locus browser extension ID"
condition = "AND"
paths = ['''^apps/browser-extension/manifest\.json$''']
regexes = ['''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA[A-Za-z0-9+/=]+''']
