[package]
name = "lattix-locus-desktop"
version = "0.2.0"
description = "Lattix Locus desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# Auto-update (Dev/Stable channels, LOCUS-349): src/updates.rs picks one of two
# compiled-in endpoints at runtime (`updater_builder().endpoints`); the pubkey is
# in tauri.conf.json. Without published signed metadata, check() just returns an
# error, which the UI ignores. Signed bundles come from desktop-dev.yml only.
tauri-plugin-updater = "2"
# Computer-use panic hotkey (LOCUS-346): registered from Rust so it fires even
# when the webview is frozen. Desktop targets only.
tauri-plugin-global-shortcut = "2"
# Out-of-band confirmation for widening the user-browser tier (LOCUS-350):
# native OS dialogs (tauri-plugin-dialog, MIT/Apache-2.0), HMAC-SHA256 proofs
# (RustCrypto hmac + sha2, MIT/Apache-2.0) and the OS CSPRNG (getrandom,
# MIT/Apache-2.0).
tauri-plugin-dialog = "2"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# By default Tauri uses a custom protocol; `custom-protocol` is required for release builds.
custom-protocol = ["tauri/custom-protocol"]
