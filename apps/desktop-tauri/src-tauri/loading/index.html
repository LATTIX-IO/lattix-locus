<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattix Locus</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0b0d12; color: #e6e8ee;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; }
      .logo { width: 116px; height: 116px; animation: pulse 2.2s ease-in-out infinite; }
      .logo path, .logo polygon { fill: #f5f7fa; }
      .bar { width: 220px; height: 3px; border-radius: 2px; background: #1c2230; overflow: hidden; }
      .bar::after { content: ""; display: block; height: 100%; width: 40%;
        background: #6ea8fe; border-radius: 2px; animation: slide 1.3s ease-in-out infinite; }
      .title { font-weight: 600; letter-spacing: .2px; }
      .muted { color: #8b93a7; font-size: 13px; max-width: 460px; text-align: center; }
      @keyframes pulse { 0%,100% { opacity: .85; } 50% { opacity: .35; } }
      @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="logo" viewBox="40 40 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locus">
        <g fill="#F4F4F2">
          <path d="M82 82H142V94H94V142H82Z"/>
          <path d="M178 82H238V142H226V94H178Z"/>
          <path d="M82 178H94V226H142V238H82Z"/>
          <path d="M226 178H238V238H178V226H226Z"/>
          <circle cx="160" cy="160" r="19"/>
        </g>
        <g fill="#9B9FA2">
          <circle cx="160" cy="58" r="16"/>
          <circle cx="58" cy="160" r="16"/>
          <circle cx="262" cy="160" r="16"/>
          <circle cx="160" cy="262" r="16"/>
        </g>
      </svg>
      <div class="bar"></div>
      <div class="title">Starting Lattix Locus…</div>
      <div class="muted" id="status">Bringing up local services (database, world-model graph, models, agents)</div>
    </div>
    <script>
      // Live first-run progress: the Rust shell forwards the supervisor's
      // "[firstrun]" lines as a `firstrun-progress` event (withGlobalTauri).
      (function () {
        var status = document.getElementById("status");
        var api = window.__TAURI__ && window.__TAURI__.event;
        if (!api || !status) return;
        api.listen("firstrun-progress", function (e) {
          if (e && typeof e.payload === "string" && e.payload.length) {
            status.textContent = e.payload;
          }
        });
      })();
    </script>
  </body>
</html>
