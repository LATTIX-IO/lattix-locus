    def safe_max(values):
        return max(values)
visible_test: |
  import os, sys; sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
  from utils import safe_max
  assert safe_max([3, 1, 2]) == 3
  assert safe_max([]) is None
  print('OK')
