id: operator-changelog-json
category: structured-artifact
kind: operator
source: LOCUS-351
problem: >-
  Produce release.json describing release 2.4.0 from CHANGELOG.md. It must be a
  JSON object with keys "version" (string), "date" (YYYY-MM-DD string),
  "changes" (list of the release's change lines as strings, without the leading
  "- ") and "breaking" (true if any change is marked BREAKING, else false).
  runtests.py checks the shape.
files:
  CHANGELOG.md: |
    # Changelog

    ## 2.5.0 - unreleased
    - Add bulk export.

    ## 2.4.0 - 2026-09-12
    - Add retry budget to the sync client.
    - BREAKING: drop the legacy /v1/export endpoint.
    - Fix a race in the cache warmer.

    ## 2.3.1 - 2026-08-30
    - Fix CSV quoting in reports.
visible_test: |
  import json, os, re
  here = os.path.dirname(os.path.abspath(__file__))
  with open(os.path.join(here, 'release.json'), encoding='utf-8') as fh:
      doc = json.load(fh)
  assert isinstance(doc, dict)
  assert set(doc) == {'version', 'date', 'changes', 'breaking'}, sorted(doc)
  assert isinstance(doc['version'], str)
  assert re.fullmatch(r'\d{4}-\d{2}-\d{2}', doc['date'])
  assert isinstance(doc['changes'], list) and all(isinstance(c, str) for c in doc['changes'])
  assert isinstance(doc['breaking'], bool)
  print('OK')
grader:
  - id: release-shape
    type: json_file
    path: release.json
    schema:
      type: object
      required: [version, date, changes, breaking]
      additionalProperties: false
      properties:
        version: {type: string}
        date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        changes: {type: array, items: {type: string}, minItems: 1}
        breaking: {type: boolean}
    equals:
      /version: 2.4.0
      /date: '2026-09-12'
      /breaking: true
  - id: release-changes
    type: tests
    script: |
      import json, os
      here = os.path.dirname(os.path.abspath(__file__))
      doc = json.load(open(os.path.join(here, 'release.json'), encoding='utf-8'))
      got = sorted(c.strip().rstrip('.') for c in doc['changes'])
      want = sorted([
          'Add retry budget to the sync client',
          'BREAKING: drop the legacy /v1/export endpoint',
          'Fix a race in the cache warmer',
      ])
      assert got == want, got
reference:
  release.json: |
    {"version": "2.4.0", "date": "2026-09-12", "breaking": true,
     "changes": ["Add retry budget to the sync client.",
                 "BREAKING: drop the legacy /v1/export endpoint.",
                 "Fix a race in the cache warmer."]}
