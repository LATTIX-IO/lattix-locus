id: ho-operator-meeting-actions
category: structured-artifact
kind: operator
source: LOCUS-351 (held-out)
problem: >-
  Extract the action items from notes/meeting-2026-09-30.md into actions.json: a
  JSON list of objects with "owner", "task" and "due" (YYYY-MM-DD), one per
  action item, in the order they appear. Decisions and discussion are not action
  items. runtests.py checks the shape.
files:
  notes/meeting-2026-09-30.md: |
    # Platform sync, 2026-09-30

    Attendees: Priya, Marco, Lena

    ## Discussion
    - Marco walked through the cache warmer race; root cause is understood.
    - Lena raised that the export endpoint is still used by two customers.

    ## Decisions
    - We keep the legacy export endpoint until 2026-12-01.

    ## Action items
    - [ ] Priya: write the migration guide for the export endpoint (due 2026-10-10)
    - [ ] Marco: ship the cache warmer fix behind a flag (due 2026-10-07)
    - [ ] Lena: email the two export customers (due 2026-10-03)
visible_test: |
  import json, os, re
  here = os.path.dirname(os.path.abspath(__file__))
  doc = json.load(open(os.path.join(here, 'actions.json'), encoding='utf-8'))
  assert isinstance(doc, list) and doc
  for item in doc:
      assert set(item) == {'owner', 'task', 'due'}, sorted(item)
      assert re.fullmatch(r'\d{4}-\d{2}-\d{2}', item['due'])
  print('OK')
grader:
  - id: actions-shape
    type: json_file
    path: actions.json
    schema:
      type: array
      minItems: 1
      items:
        type: object
        required: [owner, task, due]
        additionalProperties: false
        properties:
          owner: {type: string}
          task: {type: string}
          due: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    equals:
      /0/owner: Priya
      /0/due: '2026-10-10'
      /1/owner: Marco
      /1/due: '2026-10-07'
      /2/owner: Lena
      /2/due: '2026-10-03'
  - id: exactly-three
    type: tests
    script: |
      import json, os
      here = os.path.dirname(os.path.abspath(__file__))
      doc = json.load(open(os.path.join(here, 'actions.json'), encoding='utf-8'))
      assert len(doc) == 3, len(doc)
      assert 'migration guide' in doc[0]['task'].lower()
reference:
  actions.json: |
    [
      {"owner": "Priya", "task": "Write the migration guide for the export endpoint", "due": "2026-10-10"},
      {"owner": "Marco", "task": "Ship the cache warmer fix behind a flag", "due": "2026-10-07"},
      {"owner": "Lena", "task": "Email the two export customers", "due": "2026-10-03"}
    ]
