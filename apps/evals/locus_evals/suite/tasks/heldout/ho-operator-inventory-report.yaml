id: ho-operator-inventory-report
category: structured-artifact
kind: operator
source: LOCUS-351 (held-out)
problem: >-
  From stock.csv, write report.json: a JSON object with "skus" (number of SKUs),
  "total_units" (sum of qty) and "low_stock" (the SKUs whose qty is below their
  reorder_level, sorted alphabetically). runtests.py checks the shape.
files:
  stock.csv: |
    sku,qty,reorder_level
    WID-100,40,25
    GAD-220,5,10
    BOL-007,0,3
    NUT-310,12,12
    PIN-450,7,20
    CAP-090,100,50
visible_test: |
  import json, os
  here = os.path.dirname(os.path.abspath(__file__))
  doc = json.load(open(os.path.join(here, 'report.json'), encoding='utf-8'))
  assert set(doc) == {'skus', 'total_units', 'low_stock'}, sorted(doc)
  assert isinstance(doc['skus'], int) and isinstance(doc['total_units'], int)
  assert isinstance(doc['low_stock'], list)
  assert doc['low_stock'] == sorted(doc['low_stock'])
  print('OK')
grader:
  - id: report-values
    type: json_file
    path: report.json
    schema:
      type: object
      required: [skus, total_units, low_stock]
      additionalProperties: false
      properties:
        skus: {type: integer}
        total_units: {type: integer}
        low_stock: {type: array, items: {type: string}}
    equals:
      /skus: 6
      /total_units: 164
      /low_stock: [BOL-007, GAD-220, PIN-450]
reference:
  report.json: |
    {"skus": 6, "total_units": 164, "low_stock": ["BOL-007", "GAD-220", "PIN-450"]}
