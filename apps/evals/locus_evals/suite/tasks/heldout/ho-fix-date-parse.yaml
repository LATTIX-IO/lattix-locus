reference:
  dates.py: |
    import calendar


    def parse_iso(text):
        year, month, day = text.split("-")
        return int(year), int(month), int(day)


    def is_valid(text):
        try:
            year, month, day = parse_iso(text)
        except ValueError:
            return False
        if not 1 <= month <= 12:
            return False
        return 1 <= day <= calendar.monthrange(year, month)[1]
