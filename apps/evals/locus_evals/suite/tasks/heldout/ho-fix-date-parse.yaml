    def parse_iso(text):
        year, month, day = text.split("-")
        return int(year), int(day), int(month)


    def is_valid(text):
        try:
            year, month, day = parse_iso(text)
        except ValueError:
            return False
        return 1 <= month <= 12 and 1 <= day <= 31
