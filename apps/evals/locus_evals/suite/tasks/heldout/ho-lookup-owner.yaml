id: ho-lookup-owner
category: knowledge-lookup
kind: lookup
source: LOCUS-351 (held-out)
problem: >-
  Which file defines the function normalize_sku (not a wrapper, not a legacy
  variant)? Write its repository-relative path, with forward slashes, as the only
  content of answer.txt.
files:
  catalog/__init__.py: |
    from catalog.codes import normalize_sku  # re-export
  catalog/codes.py: |
    import re


    def normalize_sku(raw):
        return re.sub(r"[^A-Z0-9]", "", raw.upper())
  catalog/legacy.py: |
    def normalize_sku_legacy(raw):
        return raw.strip().upper()
  orders/lines.py: |
    from catalog import normalize_sku


    def line_key(order_id, raw_sku):
        return f"{order_id}:{normalize_sku(raw_sku)}"
  docs/catalog.md: |
    SKU normalization lives in the catalog package (see the codes module).
done_criteria:
  - id: answer-written
    kind: file
    path: answer.txt
    pattern: '\A\s*[A-Za-z0-9_./-]+\.py\s*\Z'
    description: answer.txt holds one .py path
grader:
  - id: correct-path
    type: file_matches
    path: answer.txt
    pattern: '\A\s*(\./)?catalog/codes\.py\s*\Z'
reference:
  answer.txt: |
    catalog/codes.py
