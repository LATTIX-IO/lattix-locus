[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "locus-evals"
version = "0.1.0"
description = "SWE-bench / DeepSWE evaluation harness for the Lattix Locus coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.7",
]

[project.optional-dependencies]
# Live SWE-bench grading + dataset loading (installed on the remote runner box).
swebench = [
  "datasets>=2.18.0",
  "swebench>=2.1.0",
]
dev = [
  "pytest>=8.3.0",
]
# Runtime bake-off (LOCUS-348, D-27): the Deep Agents runtime under test. Install in a
# SEPARATE environment -- these need LangGraph/LangChain 1.x, the platform still pins 0.x.
bakeoff = [
  "deepagents==0.7.21",
  "langchain==1.4.3",
  "langchain-core==1.6.6",
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
]

[project.scripts]
locus-evals = "locus_evals.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["locus_evals"]
