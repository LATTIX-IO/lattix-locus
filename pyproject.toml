[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lattix-locus"
version = "0.1.0"
description = "Lattix Locus open-source orchestration and control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Lattix" }
]
dependencies = [
  "PyJWT[crypto]>=2.10.1",
  "biscuit-python==0.4.0",
  "click>=8.1.7",
  # Computer use (LOCUS-341). Playwright: Microsoft, Apache-2.0. comtypes: MIT
  # (UI Automation COM on Windows). PyObjC: MIT (macOS Accessibility).
  "comtypes==1.4.17; sys_platform == 'win32'",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "keyring>=25.0.0",
  "presidio-analyzer>=2.2.355",
  "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
  "hvac>=2.3.0",
  "langgraph>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "nats-py>=2.10.0",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-exporter-otlp>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opa-python-client>=0.2.3",
  "openai>=1.50.0",
  "playwright==1.63.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  "redis>=5.2.1",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.34.0",
  "zeroconf>=0.145.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "types-PyYAML>=6.0"
]
security = [
  "gliner>=0.2.16"
]
maf = [
  "microsoft-agent-framework @ git+https://github.com/microsoft/agent-framework-python.git"
]

[project.scripts]
lattix = "locus_tooling.cli:cli"
locus-installer = "locus_tooling.installer:main"

[tool.hatch.build.targets.wheel]
packages = ["locus_tooling", "locus_runtime"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "locus_runtime.harness.codex_backend",
  "locus_runtime.harness.enforcement",
  "locus_runtime.harness.integrations",
  "locus_runtime.harness.team",
  "locus_runtime.harness.workspace",
  "locus_runtime.harness.workspace_binding",
  "locus_runtime.win_sandbox",
  "locus_tooling.cli",
  "locus_tooling.desktop",
  "locus_tooling.desktop_main",
  "locus_tooling.native_binaries",
  "locus_tooling.native_secrets",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests", "tests"]
