<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversations · Work · Lattix Locus</title>
<link rel="stylesheet" href="locus.css">
<style>
  .cv { display: grid; grid-template-columns: 280px minmax(0, 1fr) 290px; border: 1px solid var(--border); border-radius: var(--r); margin-top: 16px; height: calc(100vh - 250px); min-height: 520px; }
  .cv-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .cv-items { overflow-y: auto; flex: 1; }
  .citem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 10px 12px; }
  .citem:hover { background: var(--hover); }
  .citem[aria-current="true"] { background: var(--select); box-shadow: inset 2px 0 0 var(--fg); }
  .citem b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .citem p { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .cv-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .cv-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cv-head h2 { flex: 1; min-width: 160px; }
  .cv-body { flex: 1; overflow-y: auto; padding: 20px; }
  .cv-comp { border-top: 1px solid var(--border); padding: 10px 14px 12px; display: flex; gap: 8px; }
  .cv-comp textarea { flex: 1; }
  .cv-ctx { border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 1240px) { .cv { grid-template-columns: 250px minmax(0, 1fr); } .cv-ctx { display: none; } }
  @media (max-width: 860px) { .cv { grid-template-columns: 1fr; height: auto; } .cv-list { border-right: 0; border-bottom: 1px solid var(--border); max-height: 240px; } .cv-body { max-height: 60vh; } }
</style>
</head>
<body data-nav="work" data-crumbs='[["Work","work.html"],["Conversations","work-conversations.html"],["Conversation",""]]'>
<main id="main">
  <div class="page">
    <header class="page-h" data-od-id="work-header">
      <div class="t"><h1>Work</h1><p>Talk to Locus or a specific agent. Conversations read with your permissions and cannot act; turn one into a task when it becomes real work.</p></div>
      <div class="acts"><button class="btn btn-primary" id="newConv">New conversation</button></div>
    </header>
    <nav class="tabs" aria-label="Work views" data-od-id="work-tabs"><a href="work.html">Tasks</a><a href="work-projects.html">Projects</a><a href="work-schedules.html">Schedules</a><a href="work-conversations.html" aria-current="page">Conversations<span class="count" id="cC"></span></a></nav>
    <div class="cv" data-od-id="conversations-workspace">
      <section class="cv-list" aria-label="Conversations"><div class="filters"><input class="input" type="search" id="cf" placeholder="Search conversations" aria-label="Search conversations" style="width:100%"></div><div class="cv-items" id="clist"></div></section>
      <section class="cv-main" aria-label="Conversation"><div class="cv-head" id="chead"></div><div class="cv-body" id="cbody"><div class="chat" id="chat" aria-live="polite"></div></div>
        <form class="cv-comp" id="cForm" autocomplete="off"><label for="cIn" style="position:absolute;left:-9999px">Message</label><textarea id="cIn" class="textarea" rows="2" placeholder="Ask, brainstorm, or describe work…"></textarea><button class="btn btn-sm btn-primary" type="submit" style="align-self:flex-end">Send</button></form></section>
      <aside class="cv-ctx" aria-label="Conversation context" id="cctx"></aside>
    </div>
  </div>
</main>
<script src="locus-state.js"></script>
<script src="locus.js"></script>
<script>
  const {H, A} = LocusState, $ = s => document.querySelector(s), esc = H.esc;
  let cur = new URLSearchParams(location.search).get('cnv') || (H.s.conversations[0] || {}).id;
  const av = f => f === 'DR' ? '<span class="av">DR</span>' : `<span class="av ai">${f === 'LO' ? 'LO' : esc(H.nameOf(f).split(' ').map(w => w[0]).join(''))}</span>`;
  function render() { const S = H.s, q = $('#cf').value.toLowerCase(); $('#cC').textContent = S.conversations.length; if (!S.conversations.find(c => c.id === cur)) cur = S.conversations[0] && S.conversations[0].id;
    H.setH($('#clist'), S.conversations.filter(c => !q || c.title.toLowerCase().includes(q)).map(c => { const l = c.msgs[c.msgs.length - 1]; return `<button class="citem" data-cnv="${H.esc(c.id)}" aria-current="${c.id === cur}"><b>${esc(c.title)}</b><p>${H.esc(l ? esc(H.nameOf(l[0])) + ': ' + esc(l[1]) : 'No messages yet')}</p><div class="row-b" style="margin-top:6px"><span class="id">${esc(H.nameOf(c.with))}${H.esc(c.link ? ' · ' + c.link.id : '')}</span><span class="id">${H.ago(c.t)}</span></div></button>`; }).join('') || '<div class="empty">No conversations match.</div>');
    const c = S.conversations.find(x => x.id === cur); if (!c) return; const cr = document.querySelector('.crumbs .cur'); if (cr) cr.textContent = c.title;
    H.setH($('#chead'), `<h2>${esc(c.title)}</h2><span class="tag">With ${esc(H.nameOf(c.with))}</span>${c.link && H.linkTo(c.link) ? `<a class="btn btn-sm" href="${H.esc(H.linkTo(c.link))}">Open ${H.esc(c.link.type)} ${H.esc(c.link.id)}</a>` : '<button class="btn btn-sm" id="mkTask">Make a task</button>'}`);
    H.setH($('#chat'), `<p class="id" style="text-align:center">${H.esc(c.id)} · ${esc(c.cls)}</p>` + c.msgs.map(m => `<div class="cmsg">${av(m[0])}<div><div class="hd"><b>${esc(H.nameOf(m[0]))}</b></div><div class="bd">${esc(m[1])}</div>${m[2] ? `<details class="reason"><summary>Recorded rationale · ${H.esc(m[2].basis.length)} source${H.esc(m[2].basis.length === 1 ? '' : 's')}</summary><ol><li>${esc(m[2].summary)}</li>${m[2].basis.map(b => `<li>Evidence: ${esc(b)}</li>`).join('')}</ol></details>` : ''}</div></div>`).join(''));
    const p = c.project && H.project(c.project);
    H.setH($('#cctx'), `<div><p class="label" style="margin-bottom:8px">Linked work</p>${c.link && H.linkTo(c.link) ? `<a class="ent" href="${H.esc(H.linkTo(c.link))}"><i>${H.esc(c.link.type)}</i> ${H.esc(c.link.id)}</a>` : '<p class="small muted">Not linked. Make a task when this turns into work; the conversation is attached as context.</p>'}</div>
      <dl class="kv"><dt>Project</dt><dd>${H.esc(p ? esc(p.name) : 'None')}</dd><dt>Talking to</dt><dd>${esc(H.nameOf(c.with))}</dd><dt>Data</dt><dd><span class="cls">${H.esc(c.cls)}</span></dd><dt>Visible to</dt><dd>You${H.esc(c.link ? ', project members' : '')}</dd></dl>
      <div class="callout"><span>${Locus.icon('shield')}</span><p class="small">Conversations read with your permissions but cannot act. Actions run as tasks under the same policy and approvals as any agent.</p></div>`);
    const mk = $('#mkTask'); if (mk) mk.onclick = () => { const tid = A.conversationToTask(cur); location.href = 'task.html?task=' + tid; };
    const body = $('#cbody'); body.scrollTop = body.scrollHeight; }
  document.addEventListener('click', e => { const b = e.target.closest('[data-cnv]'); if (b) { cur = b.dataset.cnv; history.replaceState(null, '', '?cnv=' + cur); render(); } });
  $('#cf').oninput = render;
  $('#cForm').onsubmit = e => { e.preventDefault(); const v = $('#cIn').value.trim(); if (!v) { $('#cIn').focus(); return; } A.sendMessage(cur, v); $('#cIn').value = ''; };
  $('#cIn').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $('#cForm').requestSubmit(); });
  $('#newConv').onclick = () => { cur = A.newConversation(); history.replaceState(null, '', '?cnv=' + cur); render(); $('#cIn').focus(); };
  render(); LocusState.on(render);
</script>
</body>
</html>
