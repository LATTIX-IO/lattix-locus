# Build the native desktop installers (.msi/.exe, .dmg/.app, .deb/AppImage).
#
# Pipeline per OS: PyInstaller backend sidecar → Next.js standalone + vendored
# Node → `cargo tauri build` (Tauri bundles installers) → (Windows) Authenticode
# sign → upload as release assets. Pure recipe; runs in CI, not on a dev box.
#
# This is the manual / tagged installer path (D-24 test builds with
# create_release=false, or a draft release). It publishes NO updater metadata:
# the update channels (LOCUS-349, D-26) are fed only by desktop-dev.yml (merge
# to main -> Dev) and desktop-promote.yml (Dev -> Stable), which sign and verify
# every latest.json.
#
# Optional secrets:
#   WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD  (Authenticode signing)
# macOS is built unsigned/ad-hoc until an Apple Developer ID is added (then set
#   APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID).

name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 0.1.0). Test builds can leave the default."
        required: false
        default: "0.1.0-dev"
      platforms:
        description: "Which installers to build"
        type: choice
        default: windows-macos
        options: [windows-macos, windows, macos, all]
      create_release:
        description: "Create a draft GitHub release (otherwise artifacts only, D-24)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# Least privilege: read by default; the build job may create the draft release.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      release: ${{ steps.m.outputs.release }}
    steps:
      - id: m
        shell: python
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          CREATE_RELEASE: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' }}
        run: |
          import json, os
          rows = {
              "windows": {"os": "windows-latest", "triple": "x86_64-pc-windows-msvc", "ext": ".exe"},
              "macos": {"os": "macos-latest", "triple": "aarch64-apple-darwin", "ext": ""},
              "macos-intel": {"os": "macos-13", "triple": "x86_64-apple-darwin", "ext": ""},
              "linux": {"os": "ubuntu-latest", "triple": "x86_64-unknown-linux-gnu", "ext": ""},
          }
          pick = {
              "windows-macos": ["windows", "macos", "macos-intel"],
              "windows": ["windows"],
              "macos": ["macos", "macos-intel"],
              "all": ["windows", "macos", "macos-intel", "linux"],
          }[os.environ["PLATFORMS"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": [rows[k] for k in pick]}) + chr(10))
              out.write("release=" + os.environ["CREATE_RELEASE"].lower() + chr(10))

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Sign only when an Authenticode cert secret is present; otherwise the
      # build still produces an (unsigned) installer for testing.
      HAS_WIN_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # --- Linux: Tauri (WebKitGTK) system deps ---------------------------
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- 1) Backend sidecar via PyInstaller -----------------------------
      - name: Build backend sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .
          pyinstaller packaging/locus-backend.spec
          # The gateway's policy engine (fail closed without it): the pinned OPA
          # release, sha256-verified against locus_tooling/opa_release.py (the
          # step fails on a mismatch), placed beside the backend as installed.
          python -m locus_tooling.opa_release fetch --triple "${{ matrix.triple }}" \
            --dest "dist/locus-opa${{ matrix.ext }}"
          # Fail the build, not the installed app, when the bundle misses a module
          # or the policy engine does not run over the bundled policies.
          "dist/locus-backend${{ matrix.ext }}" --self-check
          mkdir -p apps/desktop-tauri/src-tauri/bin apps/desktop-tauri/src-tauri/sidecars
          cp "dist/locus-backend${{ matrix.ext }}" \
             "apps/desktop-tauri/src-tauri/bin/locus-backend-${{ matrix.triple }}${{ matrix.ext }}"
          # Tauri externalBin "sidecars/locus-opa": installed beside the app as locus-opa.
          cp "dist/locus-opa${{ matrix.ext }}" \
             "apps/desktop-tauri/src-tauri/sidecars/locus-opa-${{ matrix.triple }}${{ matrix.ext }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- 2) Frontend standalone + vendored Node -------------------------
      - name: Build frontend (Next.js standalone)
        shell: bash
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build
          # Stage the standalone server + static assets where the supervisor
          # resolves them under the bundle (see desktop.bundled_root()).
          mkdir -p ../../apps/desktop-tauri/src-tauri/resources/frontend
          cp -r .next/standalone/. ../../apps/desktop-tauri/src-tauri/resources/frontend/
          cp -r .next/static ../../apps/desktop-tauri/src-tauri/resources/frontend/.next/static
          cp -r public ../../apps/desktop-tauri/src-tauri/resources/frontend/public || true

      - name: Vendor Node runtime into the bundle
        shell: bash
        run: |
          # Copy the runner's node into bin/ so `node server.js` works offline.
          node_path="$(command -v node)"
          cp "$node_path" "apps/desktop-tauri/src-tauri/bin/node${{ matrix.ext }}" || true

      # --- 3) Rust + Tauri build ------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Generate app icons
        working-directory: apps/desktop-tauri/src-tauri
        shell: bash
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri icon ../icon-source.png

      - name: Build installers (release)
        if: needs.plan.outputs.release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-tauri/src-tauri
          # Installers only. Updater metadata comes from the channel workflows
          # (desktop-dev.yml / desktop-promote.yml), never from this path.
          includeUpdaterJson: false
          tagName: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          releaseName: "Lattix Locus ${{ github.event.inputs.version || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.triple }}

      # Test builds (D-24): installers as workflow artifacts only, no tag/release.
      - name: Build installers (artifacts only)
        if: needs.plan.outputs.release != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-tauri/src-tauri
          args: --target ${{ matrix.triple }}

      # --- 4) Windows: Authenticode-sign the produced installers ----------
      # Post-build signing changes the installer bytes. That is fine here (no
      # updater signatures are published from this path); the channel builds
      # must sign through Tauri's bundle.windows.signCommand instead.
      - name: Sign Windows installers
        if: matrix.os == 'windows-latest' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $st = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          $signtool = (Get-Item $st | Select-Object -First 1).FullName
          Get-ChildItem -Recurse apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle `
            -Include *.msi,*.exe | ForEach-Object {
              & $signtool sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd sha256 `
                /tr http://timestamp.digicert.com /td sha256 $_.FullName
              & $signtool verify /pa $_.FullName
            }
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: locus-${{ github.event.inputs.version || github.ref_name }}-${{ matrix.triple }}
          path: |
            apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.msi
            apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.exe
            apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.dmg
            apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.deb
            apps/desktop-tauri/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.AppImage
          if-no-files-found: error
