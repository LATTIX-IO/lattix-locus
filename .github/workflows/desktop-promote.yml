# Promote a Dev build to Stable (LOCUS-349, D-26) without rebuilding it.
#
# Input: a Dev version (e.g. 0.1.0-dev.42) that was published by desktop-dev.yml
# and tested on the Dev channel. The job downloads that prerelease's assets,
# re-publishes the SAME bytes as the Stable release `stable-v<version>`
# (non-prerelease, marked GitHub "latest") and moves the rolling `channel-stable`
# release's latest.json to it. The updater signatures stay valid because the
# files are byte-identical: what was tested is what ships.
#
# Without a signed Dev latest.json (no TAURI_SIGNING_PRIVATE_KEY at build time)
# the Stable release gets the installers only and NO updater metadata.

name: desktop-promote

on:
  workflow_dispatch:
    inputs:
      dev_version:
        description: "Dev version to promote, e.g. 0.1.0-dev.42 (release dev-v<version>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-stable-channel
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Passed through env (never interpolated into a script) and validated below.
      DEV_VERSION: ${{ inputs.dev_version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the version
        shell: bash
        run: |
          if [[ ! "$DEV_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.[1-9][0-9]*$ ]]; then
            echo "::error::dev_version must look like 0.1.0-dev.42"; exit 1
          fi
          if gh release view "stable-v$DEV_VERSION" >/dev/null 2>&1; then
            echo "::error::stable-v$DEV_VERSION already exists; Stable releases are immutable"; exit 1
          fi

      - name: Download the Dev release
        shell: bash
        run: |
          gh release download "dev-v$DEV_VERSION" --dir dev
          ls -l dev

      # Stable only moves forward. Promoting an older build than the current
      # Stable would also make it GitHub "latest", so refuse before publishing.
      - name: Check the Stable channel order
        shell: bash
        run: |
          mkdir -p current
          gh release download channel-stable --pattern latest.json --dir current 2>/dev/null || true
          advance="$(python scripts/desktop_channel.py should-advance \
            --candidate "$DEV_VERSION" --current current/latest.json)"
          if [ "$advance" != "true" ]; then
            echo "::error::channel-stable already points at $DEV_VERSION or a newer version"; exit 1
          fi

      - name: Write the Stable manifest
        id: manifest
        shell: bash
        run: |
          if [ -f dev/latest.json ]; then
            python scripts/desktop_channel.py promote --manifest dev/latest.json --assets dev \
              --repo "$GH_REPO" --tag "stable-v$DEV_VERSION" --out stable-latest.json
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the Stable release
        shell: bash
        run: |
          target="$(gh release view "dev-v$DEV_VERSION" --json targetCommitish --jq .targetCommitish)"
          mapfile -t files < <(find dev -maxdepth 1 -type f ! -name 'latest.json' | sort)
          if [ -f stable-latest.json ]; then
            mkdir -p stable && cp stable-latest.json stable/latest.json
            files+=("stable/latest.json")
          fi
          gh release create "stable-v$DEV_VERSION" "${files[@]}" --latest \
            --target "$target" --title "Lattix Locus $DEV_VERSION" \
            --notes "Stable promotion of Dev build $DEV_VERSION (same artifacts, no rebuild)."

      - name: Advance the Stable channel
        id: channel
        if: steps.manifest.outputs.signed == 'true'
        shell: bash
        run: |
          if ! gh release view channel-stable >/dev/null 2>&1; then
            gh release create channel-stable --prerelease --latest=false \
              --target "$(gh release view "dev-v$DEV_VERSION" --json targetCommitish --jq .targetCommitish)" \
              --title "Stable channel" \
              --notes "Rolling pointer for the Stable update channel. latest.json names the current Stable build."
          fi
          gh release upload channel-stable stable/latest.json --clobber
          echo "advanced=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        shell: bash
        env:
          SIGNED: ${{ steps.manifest.outputs.signed }}
          ADVANCED: ${{ steps.channel.outputs.advanced }}
        run: |
          {
            echo "## Stable promotion of $DEV_VERSION"
            echo
            echo "Release: \`stable-v$DEV_VERSION\` (GitHub latest), artifacts copied from \`dev-v$DEV_VERSION\`."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> **WARNING: no updater metadata was published.** The Dev release has no signed"
              echo "> \`latest.json\` (it was built without \`TAURI_SIGNING_PRIVATE_KEY\`), so"
              echo "> \`channel-stable\` was not moved. Stable installs will not see this update."
            elif [ "$ADVANCED" = "true" ]; then
              echo
              echo "\`channel-stable\` now points at $DEV_VERSION."
            else
              echo
              echo "\`channel-stable\` was not moved (a step failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
