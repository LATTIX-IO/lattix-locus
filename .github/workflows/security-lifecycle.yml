name: security-lifecycle

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        options:
          - local-secure
          - hosted
        required: true
        default: local-secure
      scope:
        type: choice
        description: Security lifecycle scope
        options:
          - threat-model
          - pentest
          - full
        required: true
        default: full

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  threat-model:
    if: ${{ inputs.scope == 'threat-model' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    name: Threat Model Validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate threat model exists and is current
        run: |
          if [ ! -f THREAT-MODEL.md ]; then
            echo "::error::THREAT-MODEL.md not found"
            exit 1
          fi
          if git log --since="90 days ago" --oneline THREAT-MODEL.md | grep -q .; then
            echo "Threat model updated recently - OK"
          else
            echo "::warning::Threat model not updated in 90+ days"
          fi
          for section in "Trust Boundaries" "Assets" "Threats" "Mitigations" "Required Tests"; do
            if grep -qi "## $section" THREAT-MODEL.md; then
              echo "Section '$section' present - OK"
            else
              echo "::error::Required section '$section' missing from THREAT-MODEL.md"
              exit 1
            fi
          done

      - name: Run threat model prompt (validation)
        if: hashFiles('.github/prompts/lattix-threat-model.prompt.md') != ''
        run: |
          echo "Threat model prompt available for manual review"
          head -50 .github/prompts/lattix-threat-model.prompt.md

      - name: Check for memory-candidate blocks
        run: |
          if grep -r "memory-candidate" --include="*.md" . | grep -v ".git" | grep -v "SKILL.md"; then
            echo "Memory candidates found - review for promotion"
          fi

  pentest:
    if: ${{ inputs.scope == 'pentest' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    name: Pentest Gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
          pip install semgrep

      - name: SAST via Semgrep
        run: |
          semgrep --config=auto --exclude .venv --exclude .next --exclude node_modules --exclude dist --sarif --output semgrep-results.sarif . || true

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: warn

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Secret scanning via Gitleaks
        run: |
          gitleaks detect --source . --no-git --redact --report-format sarif --report-path gitleaks-results.sarif || true

      - name: Upload Gitleaks artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: warn

      - name: Upload Gitleaks results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: SCA/config via Trivy
        run: |
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif --skip-dirs .venv,.next,node_modules,dist . || true

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Policy tests
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          python scripts/run_opa.py test policies/ -v

      - name: Compose config validation
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet

      - name: Helm chart validation
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint ./helm/lattix-locus
      - run: helm template lattix ./helm/lattix-locus -f helm/lattix-locus/values-prod.yaml > /dev/null

      - name: Windows sandbox tests
        run: |
          pytest tests/backend/test_windows_sandbox.py --noconftest -v

      - name: Security-focused unit tests
        run: |
          pytest tests/unit/test_security_headers.py tests/unit/test_compose_auth_contract.py tests/unit/test_helm_security_contract.py tests/unit/test_sandbox_policy.py tests/unit/test_tool_jail.py tests/unit/test_biscuit_tokens.py tests/unit/test_event_signing.py -v

      - name: Backend security tests
        run: |
          pytest apps/backend/tests/test_generated_artifacts.py -k "security or auth or memory_scope or token or sandbox" -v

  evidence-collection:
    if: ${{ inputs.scope == 'full' }}
    needs: [threat-model, pentest]
    runs-on: ubuntu-latest
    name: Evidence Collection & Reporting
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate security evidence report
        run: |
          cat > security-evidence-report.md << "REPORTEOF"
          # Security Lifecycle Evidence Report
          
          **Workflow:** ${{ github.workflow }}
          **Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Environment:** ${{ github.event.inputs.environment }}
          **Scope:** ${{ github.event.inputs.scope }}
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Threat Model Validation
          - THREAT-MODEL.md present and current: $([ -f THREAT-MODEL.md ] && echo "PASS" || echo "FAIL")
          - Required sections present: $(grep -c "^## " THREAT-MODEL.md | xargs -I {} echo "{} sections found")
          - Last updated: $(git log -1 --format="%ci" -- THREAT-MODEL.md 2>/dev/null || echo "N/A")
          
          ## Pentest Gate Results
          - SAST (Semgrep): $(ls artifacts/semgrep-results.sarif 2>/dev/null && echo "Artifacts collected" || echo "No artifacts")
          - Secret scanning (Gitleaks): $(ls artifacts/gitleaks-results.sarif 2>/dev/null && echo "Artifacts collected" || echo "No artifacts")
          - SCA/Config (Trivy): $(ls artifacts/trivy-results.sarif 2>/dev/null && echo "Artifacts collected" || echo "No artifacts")
          - Policy tests: $(echo "Run in pentest job")
          - Compose validation: $(echo "Run in pentest job")
          - Helm validation: $(echo "Run in pentest job")
          - Windows sandbox: $(echo "Run in pentest job")
          
          ## Known Posture Gaps (from THREAT-MODEL.md)
          - apps/backend not type-checked (491 mypy errors)
          - CI runs ruff check but not ruff format --check
          - Test suite collection issues (tests/__init__.py missing historically)
          - OPA policy tests require external binary
          - Several Phase 2 workstreams pending
          
          ## Rollback Guidance
          If security posture regresses:
          1. Revert to previous tagged release via rollback workflow
          2. Validate threat model assumptions still hold
          3. Re-run full security lifecycle before re-promoting
          
          ---
          *Generated by security-lifecycle workflow*
          REPORTEOF
          
          cat security-evidence-report.md

      - name: Upload security evidence report
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-report-${{ github.run_id }}
          path: security-evidence-report.md

      - name: Create GitHub Security Advisory (if critical findings)
        if: always()
        run: |
          echo "Review security evidence report for critical findings"
          echo "If CRITICAL findings exist, create a private security advisory manually"
          echo "Reference: https://docs.github.com/en/code-security/security-advisories"
